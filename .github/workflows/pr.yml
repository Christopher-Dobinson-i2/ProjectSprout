name: PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs, never runs on main.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  WORKLOAD_VERSION: 10.0.302

jobs:
  # Linux: unit tests and the Android build. Cheap, so it runs on every PR.
  test-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --version "$WORKLOAD_VERSION"
      - name: Test gate logic
        run: ./scripts/test-ci-gate.sh
      - name: Test
        run: dotnet test tests/Sprout.Tests --configuration Release
      - name: Build Android
        run: dotnet build src/Sprout.App -f net10.0-android --configuration Release

  # macOS: only what needs a Mac. Bills at about 10x Linux, so it builds the iOS simulator target and nothing else.
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Select pinned Xcode
        env:
          XCODE_VERSION: "26.6"
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --version "$WORKLOAD_VERSION"
      - name: Build iOS simulator
        run: >
          dotnet build src/Sprout.App -p:SproutTargets=net10.0-ios
          -p:EnableCodeSigning=false -p:RuntimeIdentifier=iossimulator-arm64
          --configuration Release

  # Static analysis. Same workflow also runs weekly on a schedule.
  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  # Pull requests only: blocks new dependencies with known high-severity advisories.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # The only check branch protection requires. Fails if any needed job failed, was cancelled,
  # or is not listed here, so a new job cannot silently escape the gate.
  ci-gate:
    if: always()
    needs: [test-android, ios-simulator, codeql, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REQUIRED: test-android ios-simulator codeql
      OPTIONAL: dependency-review
    steps:
      - uses: actions/checkout@v7
      - name: Evaluate needs
        run: ./scripts/ci-gate.sh <<<'${{ toJSON(needs) }}'
